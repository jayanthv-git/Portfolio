<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow-x: hidden;
    }
    body {
      height: 600vh;
    }
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
    }
    /* Subtle minimal scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const FRAME_COUNT = 238;
    const images = new Array(FRAME_COUNT);
    let targetFrame = 0;
    let currentFrame = 0;
    let lastRenderedFrame = -1;
    let isDirty = true;

    function getFramePath(index) {
      const num = String(index + 1).padStart(3, '0');
      return `frames/ezgif-frame-${num}.jpg`;
    }

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      isDirty = true;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Preload all frames
    for (let i = 0; i < FRAME_COUNT; i++) {
      const img = new Image();
      img.src = getFramePath(i);
      img.onload = () => {
        images[i] = img;
        if (i === 0 || lastRenderedFrame === -1) {
          isDirty = true;
        }
      };
      images[i] = img;
    }

    function getBestImage(idx) {
      if (images[idx] && images[idx].complete && images[idx].naturalWidth > 0) {
        return images[idx];
      }
      for (let offset = 1; offset < FRAME_COUNT; offset++) {
        const prev = idx - offset;
        if (prev >= 0 && images[prev] && images[prev].complete && images[prev].naturalWidth > 0) {
          return images[prev];
        }
        const next = idx + offset;
        if (next < FRAME_COUNT && images[next] && images[next].complete && images[next].naturalWidth > 0) {
          return images[next];
        }
      }
      return null;
    }

    function drawFrame(img) {
      if (!img) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth || 1920;
      const ih = img.naturalHeight || 1080;

      const canvasRatio = cw / ch;
      const imgRatio = iw / ih;

      let dw, dh, dx, dy;
      if (canvasRatio > imgRatio) {
        dw = cw;
        dh = Math.round(cw / imgRatio);
        dx = 0;
        dy = Math.round((ch - dh) / 2);
      } else {
        dh = ch;
        dw = Math.round(ch * imgRatio);
        dx = Math.round((cw - dw) / 2);
        dy = 0;
      }

      ctx.drawImage(img, dx, dy, dw, dh);
    }

    function updateScroll() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const scrollFraction = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;
      targetFrame = scrollFraction * (FRAME_COUNT - 1);
    }

    window.addEventListener('scroll', updateScroll, { passive: true });
    updateScroll();

    // Smooth linear interpolation (LERP) loop
    const LERP_FACTOR = 0.08;

    function render() {
      const delta = targetFrame - currentFrame;
      if (Math.abs(delta) > 0.001) {
        currentFrame += delta * LERP_FACTOR;
        isDirty = true;
      } else if (currentFrame !== targetFrame) {
        currentFrame = targetFrame;
        isDirty = true;
      }

      const frameToDraw = Math.min(FRAME_COUNT - 1, Math.max(0, Math.round(currentFrame)));

      if (isDirty || frameToDraw !== lastRenderedFrame) {
        const img = getBestImage(frameToDraw);
        if (img) {
          drawFrame(img);
          lastRenderedFrame = frameToDraw;
          isDirty = false;
        }
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
